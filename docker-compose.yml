services:
  web:
    build:
      context: .
      secrets:
        - envfile
    image: talliataula-web
    container_name: talliataula-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3000"
    # Variables en tiempo de ejecución (Resend para el formulario, etc.)
    env_file:
      - path: .env.local
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Estadísticas sin cookies. La web le reenvía /api/st/* por la red interna;
  # el puerto local es solo para entrar al panel (publicarlo como stats.talliataula.com).
  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    container_name: talliataula-umami
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3012:3000"
    env_file:
      - umami.env
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  umami-db:
    image: postgres:16-alpine
    container_name: talliataula-umami-db
    restart: unless-stopped
    env_file:
      - umami.env
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  umami-db-data:

secrets:
  envfile:
    file: ./.env.local
